name: Publish Jardi documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified site (enable only after Pages and DNS are ready)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: jardi-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Locate website
        id: site
        shell: bash
        run: |
          if [ -f Website/package.json ]; then
            echo 'directory=Website' >> "$GITHUB_OUTPUT"
          else
            echo 'directory=.' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and validate
        env:
          JARDI_CLOUDFLARE_TOKEN: ${{ vars.JARDI_CLOUDFLARE_TOKEN }}
          JARDI_GA4_MEASUREMENT_ID: ${{ vars.JARDI_GA4_MEASUREMENT_ID }}
          JARDI_GA4_HISTORY_TRACKING_DISABLED: ${{ vars.JARDI_GA4_HISTORY_TRACKING_DISABLED }}
        working-directory: ${{ steps.site.outputs.directory }}
        run: |
          npm ci
          npm run check
          npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.directory }}/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
