<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jardi Route Demo</title><link rel="stylesheet" href="style.css"></head><body><section class="jardi-demo"><div class="jardi-controls"><label>speed <input id="speed" type="range" min="1" max="20" step="1" value="15"><output id="speed-value">15</output></label><label><input type="checkbox" id="fast"> fast</label><label><input type="checkbox" id="repeat" checked> repeat</label><label><input type="checkbox" id="reverse"> reverse</label><label><input type="checkbox" id="orbit"> Orbit</label><button id="start" type="button">開始</button>
      <button id="pause" type="button">暫停</button><button id="stop" type="button">停止</button><button id="reset" type="button">重置</button></div><div class="jardi-map" id="map" aria-label="路徑動畫展示"><div id="pins"></div><div id="footprints"></div><img id="avatar" src="images/avatar.png" alt="目前位置"></div></section><script src="script.js"></script></body></html>
